<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create-DOM</title>
</head>
<body style="background-color: #212121; color: white;">
       
    <div id="elem" style="height: 300px; width: 100%; border-style: solid; border-color: rgb(97, 192, 56);">
    <div id="elem-content" style="color:black; background-color: rgb(204, 229, 39); border-style: solid; border-color: purple;">Element</div>
    <div>hello</div>
</div>

</body>
<script>
    // create a div element using script- DOM

    
   const div = document.createElement('div') // but web page pe abhi bhi nhi dik rhaa
   console.log(div);
   div.className = 'main'
  // div.id = 'myID'
   div.id = Math.round(Math.random()*10+1) // this is random ID every time 
   div.setAttribute("tittle","generated tittle")
   div.style.backgroundColor = "green"
   div.style.padding = "12px"
   //div.innerText = "chaiAurCode" --> ye values ko re-write krta hai
   const addText = document.createTextNode("chai aur code")
   div.appendChild(addText)


   document.body.appendChild(div)

   // which is optimized way talk later innerText or appendChild

    let h1 = document.createElement('h1')
    h1.textContent = "hello ji"
    document.body.append(h1)


    //
    let elem = document.getElementById("elem")
    elem.style.backgroundColor = 'Red';




</script>

</html>
